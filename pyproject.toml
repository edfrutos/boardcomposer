[project]
name = "boardcomposer"
version = "0.4.0"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "pyside6",
]

[project.scripts]
boardcomposer = "boardcomposer.cli:main"
boardcomposer-batch = "boardcomposer.batch_cli:main"
boardcomposer-serve = "boardcomposer.http_cli:main"
boardcomposer-diff = "boardcomposer.diff_cli:main"

[project.optional-dependencies]
dev = [
    "ruff==0.15.22",
    "pytest",
    "pylint",
    "flake8",
    "Flake8-pyproject",
    "mypy",
]
cp_sat = [
    "ortools",
]

[tool.ruff]
line-length = 88
target-version = "py313"

# Flake8: line length is owned by Ruff format. E501 is ignored so the IDE
# does not duplicate style noise (especially on temporary buffers).
[tool.flake8]
max-line-length = 999
extend-ignore = ["E203", "W503", "E501"]
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.pylint.main]
ignore-patterns = ["__pycache__"]
max-module-lines = 9999

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "C0301",
    "C0302",
]

[tool.pylint.typecheck]
ignored-modules = [
    "PySide6.QtCore",
    "PySide6.QtGui",
    "PySide6.QtWidgets",
]

[tool.pylint.format]
max-line-length = 999

[tool.pytest.ini_options]
pythonpath = ["src", "."]
