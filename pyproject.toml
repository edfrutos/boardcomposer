[project]
name = "boardcomposer"
version = "0.4.0.dev0"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "pyside6",
]

[project.scripts]
boardcomposer = "boardcomposer.cli:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pylint",
    "flake8",
    "Flake8-pyproject",
    "mypy",
]
cp_sat = [
    "ortools",
]

[tool.ruff]
line-length = 88
target-version = "py313"

# Canonical Flake8 settings also live in `.flake8`. This section is read when
# `Flake8-pyproject` is installed (so CLI/IDE agree on max-line-length=88).
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.pylint.main]
ignore-patterns = ["__pycache__"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
]

[tool.pylint.typecheck]
ignored-modules = [
    "PySide6.QtCore",
    "PySide6.QtGui",
    "PySide6.QtWidgets",
]

[tool.pylint.format]
max-line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src", "."]
