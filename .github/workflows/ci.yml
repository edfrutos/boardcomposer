name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries (offscreen platform plugin)
        run: |
          set -euo pipefail
          # ubuntu-latest mirrorlist prefers azure.archive.ubuntu.com, which
          # can stall apt-get update until the 6h job timeout (#536 / #537).
          for path in \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ubuntu.sources \
            /etc/apt/apt-mirrors.txt
          do
            if [ -f "$path" ]; then
              sudo sed -i \
                's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                "$path"
            fi
          done
          sudo timeout 120 apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo timeout 180 apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "ruff==0.15.22" pytest

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
